<script>
/* ============================================================
   Utilities
============================================================ */
function esc(s="") {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function normStatus(s) {
  s = String(s || "").toLowerCase().trim();
  if (s === "add" || s === "added" || s === "new") return "added";
  if (s === "update" || s === "updated" || s === "old") return "updated";
  return s || "updated";
}

function statusBadge(status) {
  const st = normStatus(status);
  const cls = (st === "added") ? "badge-added" : "badge-updated";
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}

function dateKey(item) {
  if (typeof item.timestamp === "number") return item.timestamp;
  const [month, day, year] = String(item.date || "").split("/").map(Number);
  return Date.UTC(year, month - 1, day) / 1000 || 0;
}

/* ============================================================
   State
============================================================ */
let ORIGINAL_ITEMS = [];
let GLOBAL_ITEMS   = [];
let SORT_COLUMN = "";
let SORT_DIR    = 1;

/* ============================================================
   Render Table
============================================================ */
function renderTable() {
  const container = document.getElementById("pkg-list");
  const filter = document.getElementById("filterBox").value.toLowerCase();

  let items = GLOBAL_ITEMS.filter(it => {
    if (!filter) return true;
    const hay = [
      it.date || "",
      it.upstream_date || "",
      it.name || "",
      it.auth || "",
      it.status || "",
      it.url || ""
    ].join(" ").toLowerCase();
    return hay.includes(filter);
  });

  if (SORT_COLUMN) {
    items.sort((a,b) => {
      if (SORT_COLUMN === "date")
        return SORT_DIR * (dateKey(a) - dateKey(b));
      if (SORT_COLUMN === "name")
        return SORT_DIR * String(a.name||"").localeCompare(String(b.name||""));
      if (SORT_COLUMN === "auth")
        return SORT_DIR * String(a.auth||"").localeCompare(String(b.auth||""));
      if (SORT_COLUMN === "status")
        return SORT_DIR * normStatus(a.status).localeCompare(normStatus(b.status));
      if (SORT_COLUMN === "url")
        return SORT_DIR * String(a.url||"").localeCompare(String(b.url||""));
      return 0;
    });
  }

  let html = `
  <table class="leaderboard-table">
    <thead>
      <tr>
        <th data-col="status">Status</th>
        <th data-col="date">Catalog date</th>
        <th data-col="name">Name</th>
        <th data-col="auth">Author</th>
        <th data-col="url">Category</th>
      </tr>
    </thead>
    <tbody>
  `;

  items.forEach(it => {
    const url = it.url || "#";
    const name = it.name || "(unnamed)";
    const auth = it.auth || "various";

    const legacyAnchor = encodeURIComponent(name.replace(/\s+/g, "-"));
    const pkgUrl = it.package_url || url + "#pkg-" + legacyAnchor;
    const authUrl = "authors.html" + authorFragment(auth);
    const upstreamLabel = it.upstream_kind === "forum" ? "Forum date" : "Author release/update";
    const upstreamDate = it.upstream_date
      ? `<div class="small">${esc(upstreamLabel)} <a href="${esc(it.upstream_source)}">${esc(it.upstream_date)}</a></div>`
      : "";

    function linkLabelFromUrl(url) {
      const s = String(url || "").trim();
      if (!s) return "Link";

      try {
        const u = new URL(s, "https://example.invalid/");
        const path = u.pathname || "";
        let file = path.split("/").filter(Boolean).pop() || "";
        if (file) {
          file = file.replace(/\.[^.]+$/, "");
          return file.charAt(0).toUpperCase() + file.slice(1);
        }
      } catch {}

      const noFrag = s.split("#")[0].split("?")[0];
      let file = noFrag.split("/").filter(Boolean).pop() || "";
      if (file) {
        file = file.replace(/\.[^.]+$/, "");
        return file.charAt(0).toUpperCase() + file.slice(1);
      }

      return "Link";
    }

    html += `
      <tr>
        <td>${statusBadge(it.status)}</td>
        <td>${esc(it.date || "")}${upstreamDate}</td>
        <td><a href="${esc(pkgUrl)}" target="_other">${esc(name)}</a></td>
        <td><a href="${esc(authUrl)}" target="_other">${esc(auth)}</a></td>
        <td><a href="${esc(url)}" target="_other">${esc(linkLabelFromUrl(url))}</a></td>
      </tr>`;
  });

  html += "</tbody></table>";
  container.innerHTML = html;

  document.querySelectorAll(".leaderboard-table th").forEach(th => {
    th.onclick = () => {
      const col = th.getAttribute("data-col");
      const initialDirection = (col === "date") ? -1 : 1;
      if (SORT_COLUMN === col) {
        if (SORT_DIR === initialDirection) SORT_DIR = -initialDirection;
        else { SORT_COLUMN = ""; SORT_DIR = 1; }
      } else {
        SORT_COLUMN = col;
        SORT_DIR = initialDirection;
      }
      renderTable();
    };
  });
}

/* ============================================================
   Load YAML
============================================================ */
async function loadLatestYAML() {
  const res = await fetch("data/latest.yaml", { cache: "no-store" });
  const text = await res.text();
  const data = jsyaml.load(text, { schema: jsyaml.CORE_SCHEMA });

  ORIGINAL_ITEMS = data;
  GLOBAL_ITEMS = data;

  renderTable();
  document.getElementById("filterBox").oninput = renderTable;
}

loadLatestYAML();
</script>
